# Radar's own test suite on GitHub's machines (14 Oct 2026, Anmol: "make the change, test it, deploy only if it works").
#
# Why: the full suite (165 unit + 206 real-browser e2e, 371 total) took 1–1¾ h per fix cycle when run in 4 chunks
# in a chat session. Here the e2e tests are split across 8 machines (every 8th collected test on each machine, so
# every test runs exactly once), unit tests run on a 9th. Whole suite ≈ 8–10 min. Public repo = unlimited minutes.
#
# When it runs
#   - every push to fix/v0.19, cloud-runs or main that touches code, tests or requirements
#   - "Run workflow" button on github.com
#
# How to read it
#   - the "verdict" job is green only when all 9 jobs passed; its summary (Actions > run > Summary tab) lists the
#     per-shard counts and every failing test id, so the loop can read one place.
#   - junit XML per shard is kept 7 days as the artifact `radar-tests-<run id>-<shard>`.
name: radar-tests

on:
  push:
    branches: [fix/v0.19, cloud-runs, main]
    paths:
      - "radar/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/radar-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: radar-tests-${{ github.ref }}
  cancel-in-progress: true          # a newer push to the same branch supersedes the older test run

permissions:
  contents: read

env:
  E2E_SHARDS: "8"

jobs:
  unit:
    name: unit (165)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Radar (no browser needed)
        run: python3 -m pip install -q -r requirements.txt
      - name: Unit tests
        run: python3 -m pytest -q -m "not e2e" --junitxml=junit-unit.xml 2>&1 | tee pytest-unit.log
      - name: Summary
        if: always()
        run: python3 tools/test_summary.py junit-unit.xml --label "unit" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-tests-${{ github.run_id }}-unit
          path: |
            junit-unit.xml
            pytest-unit.log
          retention-days: 7

  e2e:
    name: e2e shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Radar + Chromium
        run: |
          python3 -m pip install -q -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Pick this machine's share of the e2e tests
        id: pick
        run: |
          # every E2E_SHARDS-th collected test id, starting at this shard number: each test runs on exactly one machine
          python3 -m pytest --collect-only -q -m e2e 2>/dev/null | grep '::' \
            | awk -v n="$E2E_SHARDS" -v k="${{ matrix.shard }}" '(NR-1)%n==k' > shard.txt
          echo "count=$(wc -l < shard.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "This shard runs $(wc -l < shard.txt | tr -d ' ') tests:"; cat shard.txt
      - name: E2E tests (real Chromium + local mock store)
        if: steps.pick.outputs.count != '0'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          # ids can hold spaces and quotes (parametrize ids): one id per argument, split on newlines only
          tr '\n' '\0' < shard.txt | xargs -0 python3 -m pytest -q -p no:cacheprovider \
            --junitxml=junit-e2e-${{ matrix.shard }}.xml 2>&1 | tee pytest-e2e-${{ matrix.shard }}.log
      - name: Summary
        if: always()
        run: python3 tools/test_summary.py junit-e2e-${{ matrix.shard }}.xml --label "e2e shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-tests-${{ github.run_id }}-e2e-${{ matrix.shard }}
          path: |
            junit-e2e-${{ matrix.shard }}.xml
            pytest-e2e-${{ matrix.shard }}.log
          retention-days: 7

  verdict:
    name: verdict (all 371)
    needs: [unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: radar-tests-${{ github.run_id }}-*
          path: results
          merge-multiple: true
      - name: One verdict for the whole suite
        run: |
          python3 tools/test_summary.py results/*.xml --label "ALL" --expect 371 | tee -a "$GITHUB_STEP_SUMMARY"
