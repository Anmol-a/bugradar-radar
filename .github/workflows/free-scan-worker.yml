# The free-scan worker on GitHub's machines (18 Oct 2026). Zero cost while the repo is public.
#
# A visitor's "check my store" on the dashboard (#/scan) is a row in the dashboard's scan_requests table. Every 5 minutes
# this job starts a machine that drains that queue for up to 9 minutes with Radar's 'basic' profile (7 read-only checks,
# desktop, no cart), uploading each result like any run. It authenticates with the UPLOAD KEY only (dashboard migration
# 09: claim_scan_by_key / finish_scan_by_key), so no new secret was needed. Daily monitors are never run here: those
# need the service key and the product's own machine (radar/worker.py).
#
# GitHub starts schedules only from the default branch, and may start them a few minutes late: the loading page says
# "usually starts within a few minutes". `concurrency` keeps two machines from racing on the same queue (the claim is
# also row-locked in SQL, so a race would be harmless; this just saves minutes).
name: free-scan-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: free-scan-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: free scans
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Radar + Chromium
        run: |
          python3 -m pip install -q -r requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Serve the free-scan queue (up to 9 minutes)
        env:
          BUGRADAR_KEY: ${{ secrets.BUGRADAR_KEY }}
          RADAR_SIGNING_KEY: ${{ secrets.RADAR_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_WORKER_NAME: github-${{ github.run_id }}
        run: python3 -m radar worker --scans-only --for 540 2>&1 | tee worker.log
      - name: Summary
        if: always()
        run: |
          { echo "### free-scan worker"; echo; echo '```'; grep -E "free scan|job\(s\) done|error" worker.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
