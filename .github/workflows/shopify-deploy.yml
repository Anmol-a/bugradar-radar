# Pushes shopify-app/shopify.app.toml (app URL, no scopes, webhooks) to Shopify as a new app version.
# Runs on GitHub so nothing is needed on Anmol's Mac. Started by hand (Actions -> Shopify app deploy -> Run workflow)
# or by Claude via workflow_dispatch. Token: Dev Dashboard -> Apps -> BugRadar -> App settings -> App Automation Token,
# stored as the bugradar-radar repo secret SHOPIFY_APP_AUTOMATION_TOKEN (expires after 1/3/6 months; rotate before then).
name: Shopify app deploy

on:
  workflow_dispatch:
    inputs:
      message:
        description: Version message
        required: false
        default: deploy from GitHub

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shopify-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest
      - name: Deploy app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then echo "::error::Secret SHOPIFY_APP_AUTOMATION_TOKEN is missing on this repo"; exit 1; fi
          shopify version
          set +e
          shopify app deploy --allow-updates --message "$MESSAGE" 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          # Logs can't be read from Claude's workspace; annotations can. Repeat the CLI's last lines as annotations.
          sed -e 's/\x1b\[[0-9;]*m//g' deploy.log | grep -v '^[[:space:]]*$' | tail -25 | while IFS= read -r line; do
            if [ "$code" -eq 0 ]; then echo "::notice::$line"; else echo "::error::$line"; fi
          done
          exit $code
