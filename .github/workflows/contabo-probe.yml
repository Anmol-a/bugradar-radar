# 18 Oct: which Shopify endpoints does the Contabo IP get, HTML pages vs JSON data? (homepage 200, products.json 429?)
name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, radar]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Endpoint probe
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 BugRadar/0.1 (+bugradar.in)'
          { echo "host: $(hostname)  ip: $(curl -s -4 --max-time 10 ifconfig.me)  at $(date -u +%FT%TZ)";
            for s in theme-dawn-demo.myshopify.com bummer.in plumgoodness.com suta.in; do
              for p in / /collections/all /products.json?limit=5 /collections/all/products.json?limit=5 /search?q=tee /robots.txt /sitemap.xml /cart.js /this-page-does-not-exist-radar; do
                sleep 2; printf "%s %s %s\n" "$s" "$p" "$(curl -s -o /dev/null -w '%{http_code} %{size_download}B %{time_total}s' --max-time 25 -L -A "$UA" "https://$s$p")";
              done;
              h=$(curl -s -L -A "$UA" --max-time 25 "https://$s/collections/all" | grep -o 'href="/products/[a-z0-9-]*' | head -1 | sed 's/href="//');
              [ -n "$h" ] && { sleep 2; printf "%s %s %s\n" "$s" "$h (HTML)" "$(curl -s -o /dev/null -w '%{http_code} %{size_download}B' --max-time 25 -L -A "$UA" "https://$s$h")"; sleep 2; printf "%s %s %s\n" "$s" "$h.js (JSON)" "$(curl -s -o /dev/null -w '%{http_code} %{size_download}B' --max-time 25 -L -A "$UA" "https://$s$h.js")"; sleep 2; printf "%s %s %s\n" "$s" "$h.json (JSON)" "$(curl -s -o /dev/null -w '%{http_code} %{size_download}B' --max-time 25 -L -A "$UA" "https://$s$h.json")"; };
              echo;
            done; } | tee probe.txt
      - name: Publish to branch probe-results
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-endpoints-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-endpoints-*.txt && git commit -qm "contabo endpoint probe" && git push -q origin probe-results
