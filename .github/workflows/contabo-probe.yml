name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  status:
    runs-on: [self-hosted, radar]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose the always-on worker
        run: |
          { echo "at $(date -u +%FT%TZ) user $(whoami)";
            echo "--- crontab:"; crontab -l 2>&1 | sed 's/^/  /';
            echo "--- cron service:"; (systemctl is-active cron 2>/dev/null || systemctl is-active crond 2>/dev/null || echo unknown);
            echo "--- files:"; ls -la "$HOME/radar-worker.sh" "$HOME/radar.env" "$HOME/radar-worker.log" "$HOME/radar-worker.lock" 2>&1 | sed 's/^/  /'; ls -d "$HOME/radar-src" "$HOME/radar-venv" 2>&1 | sed 's/^/  /';
            echo "--- processes:"; pgrep -af "radar" | grep -v pgrep | sed 's/^/  /' || echo "  none";
            echo "--- worker log tail:"; tail -20 "$HOME/radar-worker.log" 2>&1 | sed 's/^/  /';
            echo "--- try starting by hand (detached):"; setsid nohup "$HOME/radar-worker.sh" >/dev/null 2>&1 < /dev/null & sleep 25;
            echo "--- processes after:"; pgrep -af "radar worker" | sed 's/^/  /' || echo "  none"; echo "--- log after:"; tail -8 "$HOME/radar-worker.log" 2>&1 | sed 's/^/  /';
          } | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-service-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-service-*.txt && git commit -qm "contabo service status" && git push -q origin probe-results
