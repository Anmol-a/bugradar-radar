name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  monitors:
    runs-on: [self-hosted, radar]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Look at the running daily check (no restart)
        run: |
          {
          echo "at $(date -u +%FT%TZ)"
          echo "--- workers:"; pgrep -af "radar worker" | sed 's/^/  /' || echo "  none"
          echo "--- chromium processes per worker:"; for p in $(pgrep -f "radar worker"); do echo "  $p: $(pgrep -P $p | wc -l) children, cpu $(ps -o %cpu= -p $p)"; done
          echo "--- slot 2 log (last 60 lines):"; tail -n 60 "$HOME/radar-worker-2.log" | cut -c1-220 | sed 's/^/  /'
          echo "--- slot 2 newest files:"; find "$HOME/radar-data-2" -newermt "-40 minutes" -type f -printf '%TT %s %p\n' 2>/dev/null | sort | tail -n 25 | sed "s#$HOME/##" | sed 's/^/  /'
          echo "--- load:"; uptime
          } 2>&1 | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-monitors-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-monitors-*.txt && git commit -qm "contabo look at a running check" && git push -q origin probe-results
