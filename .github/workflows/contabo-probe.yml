# 18 Oct: the Contabo box (self-hosted runner `radar`, vmi3647713, Mumbai) as the free-scan worker, on trial.
# Step 1 (08:13Z) showed Shopify lets it in again (10/10 stores). Step 2: serve the real free-scan queue from it for
# up to 8 minutes with Radar's basic profile, signed requests on. Runs only on this branch.
name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: free-scan-worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: [self-hosted, radar]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Radar + Chromium (user site, no sudo)
        run: |
          python3 --version
          python3 -m pip install -q --user -r requirements.txt 2>&1 | tail -2 || python3 -m pip install -q --user --break-system-packages -r requirements.txt 2>&1 | tail -2
          python3 -m playwright install chromium 2>&1 | tail -2
      - name: Serve the free-scan queue from Contabo (up to 8 minutes)
        env:
          BUGRADAR_KEY: ${{ secrets.BUGRADAR_KEY }}
          RADAR_SIGNING_KEY: ${{ secrets.RADAR_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_WORKER_NAME: contabo-${{ github.run_id }}
        run: |
          { echo "host: $(hostname)  ip: $(curl -s -4 --max-time 10 ifconfig.me || echo ?)  at $(date -u +%FT%TZ)";
            python3 -m radar worker --scans-only --for 480 2>&1 | grep -vE "^\s*$" | tail -60; } | tee probe.txt
      - name: Publish the log to branch probe-results
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-worker-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-worker-*.txt && git commit -qm "contabo worker trial" && git push -q origin probe-results
