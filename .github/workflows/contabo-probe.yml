name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  monitors:
    runs-on: [self-hosted, radar]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restart on the new main (public addresses only, 29 Oct)
        run: |
          # 19 Oct: daily monitors by upload key (dashboard migration 14 + worker monitors-by-key). Free checks are always
          # claimed first by every slot; slot 1 never takes a monitor, so a visitor never waits behind a 10-minute run.
          cat > "$HOME/radar-worker.sh" <<'SH'
          #!/bin/bash
          # worker slot $1 (1..3): one instance per slot, own data folder, shared code + venv.
          # Slot 1: free checks only. Slots 2-3: free checks first, else a due daily monitor of any workspace (BugRadar's
          # key is the operator: dashboard migration 15), uploaded with its monitor_id so it is filed in that workspace.
          SLOT="${1:-1}"
          exec 9>"$HOME/radar-worker-$SLOT.lock"; flock -n 9 || exit 0
          if [ "$SLOT" = "1" ]; then cd "$HOME/radar-src" && git fetch -q origin main && git reset -q --hard origin/main \
             && "$HOME/radar-venv/bin/python" -m pip install -q -r requirements.txt 2>/dev/null; else sleep 20; cd "$HOME/radar-src"; fi
          set -a; . "$HOME/radar.env"; set +a
          export RADAR_WORKER_NAME="contabo-$SLOT" RADAR_DATA_DIR="$HOME/radar-data-$SLOT"
          ONLY=""; [ "$SLOT" = "1" ] && ONLY="--scans-only"
          L="$HOME/radar-worker-$SLOT.log"; [ -f "$L" ] && tail -c 2000000 "$L" > "$L.tmp" && mv "$L.tmp" "$L"
          exec "$HOME/radar-venv/bin/python" -u -m radar worker $ONLY --poll 15 >> "$L" 2>&1
          SH
          chmod 700 "$HOME/radar-worker.sh"
          pkill -f 'radar worker' || true
          sleep 110
          { echo "at $(date -u +%FT%TZ)"; echo "--- code:"; git -C "$HOME/radar-src" log --oneline -1;
            grep -c "def homepage_shot" "$HOME/radar-src/radar/worker.py" | sed 's/^/  homepage_shot (want 1): /';
            grep -c "claim_monitor\", {\"worker\"" "$HOME/radar-src/radar/worker.py" | sed 's/^/  monitors by key (want 1): /';
            grep -c "scans_only=a.scans_only)" "$HOME/radar-src/radar/worker.py" | sed 's/^/  --scans-only passed through (want 3): /';
            grep -c '"monitor_id": monitor\["id"\]' "$HOME/radar-src/radar/worker.py" | sed 's/^/  uploads name their monitor (want 1): /';
            grep -c 'RECHECK_VERDICTS = ("unreachable",)' "$HOME/radar-src/radar/worker.py" | sed 's/^/  re-check before alerting (want 1): /';
            grep -c 'home_timeout_ms: int = 60000' "$HOME/radar-src/radar/core/config.py" | sed 's/^/  patient homepage (want 1): /';
            grep -c 'home_slow' "$HOME/radar-src/radar/worker.py" | sed 's/^/  slow runs re-checked (want 1): /';
            grep -c 'check_store_down=True' "$HOME/radar-src/radar/worker.py" | sed 's/^/  daily checks ask if the store is down (want 1): /';
            grep -c 'def store_answers' "$HOME/radar-src/radar/discovery/discover.py" | sed 's/^/  homepage check when robots.txt is silent (want 1): /';
            grep -c 'REGISTRY\["whatsapp_button"\]' "$HOME/radar-src/radar/checks/features.py" | sed 's/^/  WhatsApp button check (want 1): /';
            grep -c 'def cod_says' "$HOME/radar-src/radar/checks/features.py" | sed 's/^/  COD wording check (want 1): /';
            grep -c 'store_up_robots_down' "$HOME/radar-src/tools/upload_dashboard.py" | sed 's/^/  robots.txt warning (want 1): /';
            grep -c 'def _on(' "$HOME/radar-src/radar/checks/features.py" | sed 's/^/  widget re-found before acting (want 1): /';
            grep -c 'def enter_store_password' "$HOME/radar-src/radar/discovery/discover.py" | sed 's/^/  store password entered (want 1): /';
            grep -c 'def store_password' "$HOME/radar-src/radar/worker.py" | sed 's/^/  worker reads the store password (want 1): /';
            grep -c 'def plain_reason' "$HOME/radar-src/tools/upload_dashboard.py" | sed 's/^/  plain reasons, no triage in the reason (want 1): /';
            grep -c 'def plain_name' "$HOME/radar-src/tools/upload_dashboard.py" | sed 's/^/  short check names (want 1): /';
            grep -c 'def mark_also_failed' "$HOME/radar-src/tools/upload_dashboard.py" | sed 's/^/  one alert names every browser (want 1): /';
            grep -c 'def public_url' "$HOME/radar-src/radar/core/netguard.py" | sed 's/^/  public addresses only (want 1): /';
            { grep -c RADAR_ALLOW_PRIVATE_HOSTS "$HOME/radar.env" || true; } | sed 's/^/  test switch NOT set on the worker (want 0): /';
            echo "--- workers:"; pgrep -af "radar worker" | sed 's/^/  /' || echo "  none";
            echo "--- slot logs (last lines):"; for s in 1 2 3; do echo " slot $s:"; tail -n 3 "$HOME/radar-worker-$s.log" 2>/dev/null | sed 's/^/   /'; done; } | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-monitors-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-monitors-*.txt && git commit -qm "contabo monitors on slots 2-3" && git push -q origin probe-results
