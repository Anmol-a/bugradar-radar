name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  monitors:
    runs-on: [self-hosted, radar]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Network check (21 Oct; the Dawn demo homepage timed out twice from this box; workers are NOT restarted)
        run: |
          {
          echo "at $(date -u +%FT%TZ)  (box clock; compare with UTC)"
          echo "--- box: $(nproc) cpus; $(uptime)"; free -m | sed 's/^/  /'
          echo "--- resolver:"; grep -v '^#' /etc/resolv.conf | sed 's/^/  /'; (resolvectl status 2>/dev/null | grep -E "DNS Server|Current DNS" | sed 's/^/  /') || true
          echo "--- dns (getent, seconds):"
          for h in theme-dawn-demo.myshopify.com cdn.shopify.com theme-dawn-demo.myshopify.com onijwpgvpojpvgumvfim.supabase.co www.google.com cdn.shopify.com monorail-edge.shopifysvc.com; do
            s=$(date +%s.%N); if timeout 20 getent hosts "$h" >/dev/null; then r=ok; else r=FAIL; fi; e=$(date +%s.%N)
            echo "  $h $r $(python3 -c "print(round($e-$s,2))")"; done
          echo "--- curl:"
          for i in 1 2 3; do for u in https://theme-dawn-demo.myshopify.com/ http://theme-dawn-demo.myshopify.com/; do
            curl -s -o /dev/null -L -A "Mozilla/5.0" -w "  $u code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total}\n" --max-time 60 "$u" || echo "  $u curl failed ($?)"; done; done
          echo "--- worker logs today (unreachable / timeouts / name resolution):"
          for s in 1 2 3; do echo " slot $s: $(grep -c 'unreachable' $HOME/radar-worker-$s.log 2>/dev/null) unreachable, $(grep -c 'Timeout 30000ms' $HOME/radar-worker-$s.log 2>/dev/null) goto timeouts, $(grep -c 'name resolution' $HOME/radar-worker-$s.log 2>/dev/null) name-resolution errors (whole log)"; grep -E "unreachable|name resolution" $HOME/radar-worker-$s.log 2>/dev/null | tail -n 6 | sed 's/^/   /'; done
          echo "--- browser (the worker's own Chromium, 3 loads per device, HTML-ready and full-load seconds, slow requests):"
          cd "$HOME/radar-src" && timeout 400 "$HOME/radar-venv/bin/python" - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          url = "https://theme-dawn-demo.myshopify.com/"
          with sync_playwright() as p:
              b = p.chromium.launch()
              for name, opts in (("desktop", {"viewport": {"width": 1366, "height": 900}}), ("mobile", dict(p.devices["iPhone 13"]))):
                  for i in range(3):
                      ctx = b.new_context(**opts); page = ctx.new_page(); slow = []; failed = []; starts = {}
                      page.on("request", lambda r: starts.__setitem__(r, time.time()))
                      page.on("requestfinished", lambda r: (time.time() - starts.get(r, time.time()) > 4) and slow.append(f"{round(time.time() - starts[r], 1)}s {r.url[:90]}"))
                      page.on("requestfailed", lambda r: failed.append(f"{r.failure} {r.url[:90]}"))
                      t0 = time.time()
                      try:
                          page.goto(url, wait_until="domcontentloaded", timeout=60000); dcl = round(time.time() - t0, 1)
                      except Exception as e:
                          dcl = f"FAILED {str(e).splitlines()[0][:80]}"
                      try:
                          page.wait_for_load_state("load", timeout=30000); full = round(time.time() - t0, 1)
                      except Exception:
                          full = "no load in 30 s"
                      print(f"  {name} #{i+1}: html-ready {dcl}  full {full}  slow={slow[:4]} failed={failed[:3]}", flush=True)
                      ctx.close()
              b.close()
          PY
          } 2>&1 | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-monitors-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-monitors-*.txt && git commit -qm "contabo network check" && git push -q origin probe-results
