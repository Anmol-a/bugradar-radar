# 18 Oct: the Contabo box (self-hosted runner `radar`, Mumbai) serving the free-scan queue, WITH the in-page data fix.
name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: free-scan-worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: [self-hosted, radar]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install Radar + Chromium (venv kept on the box)
        run: |
          python3 -m venv "$HOME/radar-venv"
          . "$HOME/radar-venv/bin/activate"
          python -m pip install -q -r requirements.txt
          python -m playwright install chromium 2>&1 | tail -1
      - name: Serve the free-scan queue from Contabo (up to 8 minutes)
        env:
          BUGRADAR_KEY: ${{ secrets.BUGRADAR_KEY }}
          RADAR_SIGNING_KEY: ${{ secrets.RADAR_SIGNING_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_WORKER_NAME: contabo-${{ github.run_id }}
        run: |
          . "$HOME/radar-venv/bin/activate"
          { echo "host: $(hostname)  ip: $(curl -s -4 --max-time 10 ifconfig.me || echo ?)  at $(date -u +%FT%TZ)";
            python -m radar worker --scans-only --for 480 2>&1 | grep -vE "^\s*$|SyntaxWarning|st = ctx|m = ctx" | tail -80; } | tee probe.txt
      - name: Publish the log to branch probe-results
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-worker-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-worker-*.txt && git commit -qm "contabo worker trial (in-page fix)" && git push -q origin probe-results
