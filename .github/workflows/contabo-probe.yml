name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  restart:
    runs-on: [self-hosted, radar]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restart the workers so they pull the new main
        run: |
          pkill -f 'radar worker' || true
          sleep 100
          { echo "at $(date -u +%FT%TZ)"; echo "--- code:"; git -C "$HOME/radar-src" log --oneline -1;
            grep -c scan_request_id "$HOME/radar-src/radar/worker.py" | sed 's/^/  scan_request_id mentions in worker.py: /';
            echo "--- workers:"; pgrep -af "radar worker" | sed 's/^/  /' || echo "  none"; } | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-restart-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-restart-*.txt && git commit -qm "contabo restart" && git push -q origin probe-results
