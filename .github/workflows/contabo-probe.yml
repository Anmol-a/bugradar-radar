name: contabo-probe
on:
  push:
    branches: [probe-contabo]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  install:
    runs-on: [self-hosted, radar]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the crontab entry (cron keeps the worker alive, independent of GitHub jobs)
        run: |
          sed -i 's|"\$HOME/radar-venv/bin/python" -m radar worker|"$HOME/radar-venv/bin/python" -u -m radar worker|' "$HOME/radar-worker.sh" || true
          grep -q -- "-u -m radar worker" "$HOME/radar-worker.sh" || sed -i 's|-m radar worker --scans-only|-u -m radar worker --scans-only|' "$HOME/radar-worker.sh"
          set +e
          { crontab -l 2>/dev/null | grep -v "radar-worker" | grep -v "radar worker"; } > /tmp/radar.cron
          echo "* * * * * $HOME/radar-worker.sh" >> /tmp/radar.cron
          echo "0 22 * * * pkill -f 'radar worker' >/dev/null 2>&1" >> /tmp/radar.cron
          crontab /tmp/radar.cron && echo "crontab installed:" && crontab -l
          echo "--- waiting 95 s for cron to start the worker"; sleep 95
          { echo "at $(date -u +%FT%TZ)"; echo "--- processes:"; pgrep -af "radar worker" | sed 's/^/  /' || echo "  none"; echo "--- log:"; grep -v "SyntaxWarning\|st = ctx\|m = ctx" "$HOME/radar-worker.log" | tail -8 | sed 's/^/  /'; } | tee probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name radar-probe && git config user.email probe@bugradar.in
          git fetch origin probe-results && git checkout probe-results
          cp probe.txt contabo-cron-$(date -u +%Y%m%dT%H%M%SZ).txt && git add contabo-cron-*.txt && git commit -qm "contabo cron install" && git push -q origin probe-results
